quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:smoke;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true

# Parboiled loads the parser's classes through its own class loader (AsmUtils.class.getClassLoader()) and checks them
# against its own types. In Quarkus dev/test mode kumuluzee-rest-core is loaded by the restartable class loader while
# parboiled would stay in the base class loader, so parsing fails with
# "GrammarException: Illegal rule definition: Unwrapped action expression!". Keep them in the same class loader.
# (Irrelevant for the packaged application, which uses a single class loader.)
quarkus.class-loading.reloadable-artifacts=com.kumuluz.ee.rest:kumuluzee-rest-core,org.parboiled:parboiled-java,org.parboiled:parboiled-core
